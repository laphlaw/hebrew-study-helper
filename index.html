<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Hebrew Word Study Helper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="study-panel" aria-labelledby="app-title">
        <div class="topbar">
          <div class="brand-line">
            <h1 id="app-title">Word Helper</h1>
          </div>
          <div class="chapter-picker" aria-label="Chapter picker">
            <select id="book-select" aria-label="Book"></select>
            <select id="chapter-select" aria-label="Chapter"></select>
            <select id="mode-select" aria-label="Mode">
              <option value="study">Study</option>
              <option value="reading">Reading</option>
            </select>
            <button id="manage-mastered-button" class="text-link" type="button">Manage mastered</button>
          </div>
        </div>

        <section id="flashcard-section" class="flashcard" aria-live="polite">
          <button id="card-button" class="card-button" type="button" aria-label="Reveal answer">
            <span id="hebrew-word" class="hebrew" dir="rtl">טוֹב</span>
            <span id="english-word" class="english hidden">good</span>
          </button>
          <div class="card-meta">
            <span id="card-count">0 / 0</span>
            <button id="master-word-button" class="subtle-button" type="button">Mark as mastered</button>
          </div>
        </section>

        <section id="reading-section" class="reading-section hidden" aria-live="polite">
          <div class="reading-toolbar">
            <div id="reading-status" class="reading-status">Loading...</div>
            <label class="reading-font-control">
              <span>Font</span>
              <input id="reading-font-size" type="range" min="1.6" max="5.5" step="0.1" value="3.2" aria-label="Reading font size">
              <span id="reading-font-label">3.2rem</span>
            </label>
            <button id="reading-fullscreen-button" class="text-link" type="button">Fullscreen</button>
          </div>
          <button id="reading-exit-fullscreen-button" class="reading-exit-fullscreen text-link" type="button">Exit fullscreen</button>
          <div id="reading-text" class="reading-text" dir="rtl">
            <div id="reading-nav" class="reading-nav" dir="ltr">
              <button id="reading-prev-button" class="secondary-button" type="button">Previous</button>
              <button id="reading-next-button" class="secondary-button" type="button">Next</button>
            </div>
          </div>
        </section>

        <div id="settings-section" class="settings">
          <label>
            <span class="sr-only">Direction</span>
            <select id="direction-select">
              <option value="hebrew">Hebrew to English</option>
              <option value="english">English to Hebrew</option>
            </select>
          </label>
          <label>
            <span class="sr-only">Form</span>
            <select id="form-select">
              <option value="root">Root/headword</option>
              <option value="text">As it appears</option>
            </select>
          </label>
          <label>
            <span class="sr-only">Part of speech</span>
            <select id="pos-select">
              <option value="all">All words</option>
              <option value="noun">Nouns</option>
              <option value="verb">Verbs</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label>
            <span class="sr-only">Filter</span>
            <input id="search-input" type="search" placeholder="Search Hebrew, root, or English">
          </label>
          <label class="inline-check">
            <input id="show-mastered-toggle" type="checkbox">
            <span>Show mastered</span>
          </label>
          <label>
            <span class="sr-only">Order</span>
            <select id="order-select">
              <option value="random">Random</option>
              <option value="ordered">In order</option>
            </select>
          </label>
          <label class="auto-advance-control">
            <input id="auto-advance-toggle" type="checkbox">
            <span>Auto</span>
            <input id="auto-advance-speed" type="range" min="0.1" max="5" step="0.1" value="3" aria-label="Auto-advance speed">
            <span id="auto-advance-label">3s</span>
          </label>
        </div>

        <details id="word-list-section" class="word-list">
          <summary class="list-heading">
            <h2 id="list-title">Words</h2>
          </summary>
          <div id="word-table" class="word-table"></div>
        </details>
      </section>
    </main>

    <dialog id="mastered-dialog" class="mastered-dialog" aria-labelledby="mastered-title">
      <form method="dialog" class="mastered-modal">
        <div class="modal-topbar">
          <div>
            <h2 id="mastered-title">Mastered Words</h2>
            <p id="mastered-summary">0 words</p>
          </div>
          <div class="modal-actions">
            <button id="remove-all-mastered-button" class="secondary-button" type="button">Remove all</button>
            <button class="icon-button" type="submit" aria-label="Close">×</button>
          </div>
        </div>

        <div id="mastered-list" class="mastered-list"></div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
