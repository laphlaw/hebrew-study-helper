<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>Hebrew & Korean Word Study Helper</title>
    <link rel="icon" href="data:,">
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("hebrew-study-helper:preferences") || "{}");
          if (saved.theme === "dark") document.documentElement.dataset.theme = "dark";
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="study-panel" aria-labelledby="app-title">
        <div class="topbar">
          <div class="brand-line">
            <h1 id="app-title">Word Helper</h1>
          </div>
          <div class="chapter-picker" aria-label="Chapter picker">
            <select id="language-select" aria-label="Study language">
              <option value="hebrew">Hebrew</option>
              <option value="korean">Korean (KLB)</option>
            </select>
            <select id="book-select" aria-label="Book"></select>
            <select id="chapter-select" aria-label="Chapter"></select>
            <select id="mode-select" aria-label="Mode">
              <option value="study">Study</option>
              <option value="reading">Reading</option>
              <option value="alphabet">Alphabet</option>
              <option value="audio">Audio Flashcards</option>
              <option value="writing">Writing</option>
              <option value="verbs">Verb Practice</option>
            </select>
            <button id="theme-toggle-button" class="text-link" type="button" aria-pressed="false">Dark</button>
            <button id="settings-button" class="text-link" type="button">Settings</button>
            <button id="manage-mastered-button" class="text-link" type="button">Manage mastered</button>
          </div>
        </div>

        <section id="flashcard-section" class="flashcard" aria-live="polite">
          <button id="card-button" class="card-button" type="button" aria-label="Next word">
            <span id="hebrew-word" class="hebrew" dir="rtl">טוֹב</span>
            <span id="english-word" class="english hidden">good</span>
            <span id="word-breakdown" class="word-breakdown hidden"></span>
            <span id="root-word" class="root-word hidden" dir="rtl"></span>
          </button>
          <div class="answer-controls" aria-label="Word navigation">
            <button id="previous-word-button" class="answer-nav-button" type="button" aria-label="Previous word">&lt;</button>
            <button id="reveal-button" class="reveal-answer-button" type="button">Show Answer</button>
            <button id="next-word-button" class="answer-nav-button" type="button" aria-label="Next word">&gt;</button>
          </div>
          <div class="card-meta">
            <span id="card-count">0 / 0</span>
            <button id="master-word-button" class="subtle-button" type="button">Mark as mastered</button>
          </div>
        </section>

        <section id="reading-section" class="reading-section hidden" aria-live="polite">
          <div class="reading-toolbar">
            <div id="reading-status" class="reading-status">Loading...</div>
            <label class="reading-font-control">
              <span>Font</span>
              <input id="reading-font-size" type="range" min="1.6" max="5.5" step="0.1" value="3.2" aria-label="Reading font size">
              <span id="reading-font-label">3.2rem</span>
            </label>
            <button id="reading-fullscreen-button" class="text-link" type="button">Fullscreen</button>
          </div>
          <button id="reading-exit-fullscreen-button" class="reading-exit-fullscreen text-link" type="button">Exit fullscreen</button>
          <div id="reading-text" class="reading-text" dir="rtl">
            <div id="reading-nav" class="reading-nav" dir="ltr">
              <button id="reading-prev-button" class="secondary-button" type="button">Previous</button>
              <button id="reading-next-button" class="secondary-button" type="button">Next</button>
            </div>
          </div>
        </section>

        <section id="audio-flashcard-section" class="audio-flashcard-section hidden" aria-live="polite">
          <div class="elevenlabs-audio-player" aria-label="Generated audio player">
            <div id="elevenlabs-audio-status" class="elevenlabs-audio-status">No generated audio loaded.</div>
            <div class="elevenlabs-audio-actions">
              <button id="elevenlabs-play-button" class="secondary-button" type="button">Play audio</button>
              <button id="elevenlabs-stop-button" class="secondary-button" type="button">Stop</button>
              <button id="elevenlabs-next-button" class="secondary-button" type="button">Next</button>
            </div>
          </div>
          <div id="elevenlabs-cache-panel" class="elevenlabs-cache-panel hidden" aria-label="Generated audio words">
            <div class="elevenlabs-cache-toolbar">
              <div id="elevenlabs-cache-status" class="elevenlabs-cache-status">0 selected</div>
              <div class="elevenlabs-cache-actions">
                <label class="elevenlabs-shuffle-toggle">
                  <input id="elevenlabs-shuffle-toggle" type="checkbox">
                  <span>Shuffle</span>
                </label>
                <button id="elevenlabs-cache-all-button" class="secondary-button" type="button">All</button>
                <button id="elevenlabs-cache-none-button" class="secondary-button" type="button">None</button>
              </div>
            </div>
            <div id="elevenlabs-cache-list" class="elevenlabs-cache-list"></div>
          </div>
        </section>

        <section id="verb-practice-section" class="verb-practice hidden" aria-live="polite">
          <select id="verb-select" class="verb-select" aria-label="Jump to verb"></select>
          <button id="verb-card-button" class="verb-card-button" type="button" aria-label="Next verb">
            <span id="verb-root" class="verb-root" dir="rtl"></span>
            <span id="verb-gloss" class="verb-gloss hidden"></span>
            <span id="verb-selection-label" class="verb-selection-label hidden"></span>
            <span id="verb-aspect-help" class="verb-aspect-help hidden"></span>
            <span id="verb-answer-gloss" class="verb-answer-gloss hidden"></span>
          </button>
          <div class="verb-control-group" aria-label="Person">
            <div id="verb-person-options" class="verb-options"></div>
          </div>
          <div class="verb-control-group" aria-label="Aspect">
            <div id="verb-aspect-options" class="verb-options"></div>
          </div>
          <div class="card-meta">
            <span id="verb-count">0 / 0</span>
          </div>
        </section>

        <section id="writing-section" class="writing-practice hidden" aria-live="polite">
          <button id="writing-card-button" class="writing-card-button" type="button" aria-label="Next writing word">
            <span id="writing-prompt" class="writing-prompt"></span>
            <span id="writing-slots" class="writing-slots" dir="rtl"></span>
            <span id="writing-status" class="writing-status"></span>
          </button>
          <div class="card-meta">
            <span id="writing-count">0 / 0</span>
          </div>
          <div id="hebrew-keyboard" class="hebrew-keyboard" aria-label="Hebrew keyboard"></div>
        </section>

        <details id="word-list-section" class="word-list">
          <summary class="list-heading">
            <h2 id="list-title">Words</h2>
          </summary>
          <div id="word-table" class="word-table"></div>
        </details>
      </section>
    </main>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-modal">
        <div class="modal-topbar">
          <h2 id="settings-title">Settings</h2>
          <button id="settings-close-button" class="icon-button" type="button" aria-label="Close">×</button>
        </div>
          <div id="settings-section" class="settings">
            <label>
              <span class="sr-only">Direction</span>
              <select id="direction-select">
                <option value="hebrew">Hebrew to English</option>
                <option value="english">English to Hebrew</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Part of speech</span>
              <select id="pos-select">
                <option value="all">All words</option>
                <option value="noun">Nouns</option>
                <option value="verb">Verbs</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Filter</span>
              <input id="search-input" type="search" placeholder="Search Hebrew, root, or English">
            </label>
            <label class="inline-check">
              <input id="show-mastered-toggle" type="checkbox">
              <span>Show mastered</span>
            </label>
            <label>
              <span class="sr-only">Order</span>
              <select id="order-select">
                <option value="random">Random</option>
                <option value="ordered">In order</option>
              </select>
            </label>
            <label class="auto-advance-control">
              <input id="auto-advance-toggle" type="checkbox">
              <span>Auto</span>
              <input id="auto-advance-speed" type="range" min="0.1" max="5" step="0.1" value="3" aria-label="Auto-advance speed">
              <span id="auto-advance-label">3s</span>
            </label>
          </div>
      </div>
    </dialog>

    <dialog id="mastered-dialog" class="mastered-dialog" aria-labelledby="mastered-title">
      <form method="dialog" class="mastered-modal">
        <div class="modal-topbar">
          <div>
            <h2 id="mastered-title">Mastered Words</h2>
            <p id="mastered-summary">0 words</p>
          </div>
          <div class="modal-actions">
            <button id="remove-all-mastered-button" class="secondary-button" type="button">Remove all</button>
            <button class="icon-button" type="submit" aria-label="Close">×</button>
          </div>
        </div>

        <div id="mastered-list" class="mastered-list"></div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
