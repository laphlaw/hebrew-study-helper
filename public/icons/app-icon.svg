<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Word Helper</title>
  <desc id="desc">A rounded app icon with the Hebrew letter aleph and the Korean Hangul character han.</desc>
  <defs>
    <linearGradient id="paper" x1="86" x2="426" y1="54" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f1e7d8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#241c12" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#175c64"/>
  <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#paper)" filter="url(#soft-shadow)"/>
  <text
    x="178"
    y="314"
    fill="#171412"
    direction="rtl"
    font-family="SBL Hebrew, SBL_Hbrw, Ezra SIL, Cardo, SF Hebrew, Times New Roman, serif"
    font-size="222"
    font-weight="700"
    text-anchor="middle">א</text>
  <text
    x="330"
    y="307"
    fill="#175c64"
    font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, Arial Unicode MS, sans-serif"
    font-size="178"
    font-weight="800"
    text-anchor="middle">한</text>
</svg>
